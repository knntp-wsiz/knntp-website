  <circle cx="760" cy="735" r="7" fill="#64aec9"/>
  <text x="80" y="270" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="50" fill="#8a9aa6">
    <tspan x="80" dy="0" fill="#64aec9">class</tspan><tspan fill="#d7e3ea"> Course</tspan><tspan>:</tspan>
    <tspan x="128" dy="78" fill="#64aec9">def</tspan><tspan fill="#d7e3ea"> start</tspan><tspan>(self):</tspan>
    <tspan x="176" dy="78" fill="#64aec9">try</tspan><tspan>:</tspan>
    <tspan x="224" dy="78">self.run()</tspan>
    <tspan x="176" dy="78" fill="#64aec9">except</tspan><tspan> Error:</tspan>
    <tspan x="224" dy="78">self.retry()</tspan>
  </text>
